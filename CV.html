<title>CV Xanh Đỏ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,600..900&family=Be+Vietnam+Pro:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Bố cục: các dải màu xanh biển và đỏ xen kẽ, ngăn cách bằng đường sóng đang trôi. Mỗi phần có một hiệu ứng riêng. */
:root {
  --font-display: "Archivo", "Arial Narrow", Arial, sans-serif;
  --font-body: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;

  --band-blue: #0B3D91;
  --band-blue-deep: #082A66;
  --band-red: #D1203A;
  --red-on-blue: #FF7A8C;

  --paper: #F3F7FC;
  --paper-2: #E6EDF8;
  --card: #FFFFFF;
  --ink: #0D1B33;
  --ink-soft: #425371;
  --line: #C6D3E7;
  --blue-text: #0B3D91;
  --red-text: #BE1830;
  --focus: #0B3D91;

  --on-band: #FFFFFF;
  --on-band-soft: rgba(255, 255, 255, 0.84);
  --on-band-line: rgba(255, 255, 255, 0.3);

  --wave-h: clamp(26px, 4.2vw, 52px);
  --band-pad: clamp(52px, 8vw, 92px);
  --ease: cubic-bezier(.2, .8, .2, 1);
  --pop: cubic-bezier(.3, 1.6, .5, 1);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --band-blue: #0C3079;
    --band-blue-deep: #05163A;
    --band-red: #B01B33;
    --paper: #09111F;
    --paper-2: #101C33;
    --card: #0F1A30;
    --ink: #EAF0FA;
    --ink-soft: #A5B4CE;
    --line: #22324F;
    --blue-text: #86AEFF;
    --red-text: #FF7A8C;
    --focus: #86AEFF;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --band-blue: #0C3079;
  --band-blue-deep: #05163A;
  --band-red: #B01B33;
  --paper: #09111F;
  --paper-2: #101C33;
  --card: #0F1A30;
  --ink: #EAF0FA;
  --ink-soft: #A5B4CE;
  --line: #22324F;
  --blue-text: #86AEFF;
  --red-text: #FF7A8C;
  --focus: #86AEFF;
  color-scheme: dark;
}

html { scroll-behavior: smooth; scroll-padding-top: 76px; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.65;
  -webkit-text-size-adjust: 100%;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 30; background: var(--band-blue-deep);
}
* { box-sizing: border-box; }
h1, h2, h3, h4 { margin: 0; text-wrap: balance; font-family: var(--font-display); }
p { margin: 0; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
.band--blue :focus-visible, .band--red :focus-visible, .top :focus-visible, .foot :focus-visible { outline-color: #fff; }

.wrap {
  width: 100%; max-width: 1120px; margin-left: auto; margin-right: auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* Thanh điều hướng và thanh tiến độ cuộn */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: var(--band-blue-deep); color: var(--on-band);
  border-bottom: 1px solid var(--on-band-line);
}
.top .wrap { display: flex; align-items: center; gap: 20px; padding-top: 10px; padding-bottom: 10px; }
.progress {
  position: absolute; left: 0; bottom: -1px; width: 100%; height: 3px;
  background: var(--red-on-blue); transform-origin: left; transform: scaleX(var(--p, 0));
}
.brand {
  flex: none; font-family: var(--font-display); font-stretch: 125%; font-weight: 900;
  font-size: 18px; letter-spacing: 0.02em; text-decoration: none;
  display: inline-flex; align-items: center; gap: 8px;
}
.brand i { width: 12px; height: 12px; background: var(--red-on-blue); display: inline-block; transition: transform 0.5s var(--pop); }
.brand:hover i { transform: rotate(135deg) scale(1.2); }
.nav {
  min-width: 0; flex: 1; display: flex; justify-content: flex-end; gap: 22px;
  overflow-x: auto; scrollbar-width: none;
}
.nav::-webkit-scrollbar { display: none; }
.nav a {
  flex: none; text-decoration: none; color: var(--on-band-soft);
  font-size: 14px; font-weight: 500; padding: 8px 2px; border-bottom: 3px solid transparent;
  transition: color 0.2s, border-color 0.25s;
}
.nav a:hover { color: #fff; }
.nav a[aria-current="true"] { color: #fff; border-bottom-color: var(--red-on-blue); }

.notice {
  background: var(--paper-2); color: var(--ink-soft); border-bottom: 1px solid var(--line);
  font-family: var(--font-mono); font-size: 13px; line-height: 1.5;
}
.notice .wrap { display: flex; align-items: center; gap: 12px; padding-top: 10px; padding-bottom: 10px; }
.notice span { flex: 1; min-width: 0; }
.notice button {
  flex: none; font: inherit; color: var(--blue-text); background: transparent;
  border: 1px solid var(--line); border-radius: 3px; padding: 4px 10px; cursor: pointer;
}

/* Dải màu và sóng trôi */
.band { position: relative; overflow: clip; padding-top: var(--band-pad); padding-bottom: calc(var(--band-pad) + var(--wave-h)); }
.band--blue { background: var(--band-blue); color: var(--on-band); }
.band--red { background: var(--band-red); color: var(--on-band); }
.band--paper { background: var(--paper); color: var(--ink); }
.wave {
  position: absolute; left: 0; bottom: -1px; width: 200%; height: var(--wave-h); display: block;
  animation: drift 16s linear infinite;
}
.band:nth-of-type(even) .wave { animation-direction: reverse; animation-duration: 22s; }
.wave--paper { color: var(--paper); }
.wave--red { color: var(--band-red); }
.wave--blue { color: var(--band-blue); }
.wave--deep { color: var(--band-blue-deep); }

.eyebrow {
  display: inline-flex; align-items: center; gap: 10px;
  font-family: var(--font-mono); font-size: 13px; font-weight: 500;
  letter-spacing: 0.12em; text-transform: uppercase;
}
.eyebrow::before { content: ""; width: 12px; height: 12px; background: currentColor; }
.eyebrow--blue { color: var(--blue-text); }
.eyebrow--red { color: var(--red-text); }
.band--blue .eyebrow, .band--red .eyebrow { color: var(--on-band); }
.band--blue .eyebrow::before { background: var(--red-on-blue); }
.h2 {
  font-stretch: 112%; font-weight: 800; font-size: clamp(1.8rem, 4.6vw, 3rem);
  line-height: 1.1; letter-spacing: -0.01em; margin-top: 14px;
}
.sec-head { margin-bottom: clamp(28px, 5vw, 48px); }

/* HERO: chữ rơi từng ký tự, từ khoá đổi liên tục, vòng tròn xoay, thẻ nổi nhẹ */
.hero { padding-top: clamp(36px, 6vw, 72px); }
.hero .wrap { position: relative; z-index: 1; }
.hero__grid {
  display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr);
  gap: clamp(28px, 5vw, 64px); align-items: center;
}
.hero__name {
  font-stretch: 125%; font-weight: 900; text-transform: uppercase;
  font-size: clamp(2.3rem, 7.2vw, 5rem); line-height: 1.02; letter-spacing: -0.015em;
  margin-top: 18px;
}
.w { display: inline-block; white-space: nowrap; }
.ch { display: inline-block; animation: letter 0.8s var(--ease) both; animation-delay: calc(var(--i) * 55ms + 0.1s); }
.hl { color: var(--red-on-blue); }
.hero__role { margin-top: 18px; font-size: clamp(1.05rem, 2.4vw, 1.3rem); font-weight: 600; }
.hero__rot { margin-top: 6px; font-family: var(--font-mono); font-size: 15px; color: var(--on-band-soft); }
.rot { display: inline-block; height: 1.7em; overflow: hidden; vertical-align: bottom; color: var(--red-on-blue); font-weight: 500; }
.rot__inner { display: flex; flex-direction: column; }
.rot__inner span { display: block; height: 1.7em; line-height: 1.7em; white-space: nowrap; }
.hero__pitch { margin-top: 14px; max-width: 58ch; color: var(--on-band-soft); }
.cta { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 28px; }
.btn {
  font: 600 15px/1 var(--font-body); padding: 14px 22px; border-radius: 4px;
  border: 2px solid transparent; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center;
  transition: transform 0.2s var(--ease), background 0.2s;
}
.btn:hover { transform: translateY(-3px); }
.btn--red { background: #D1203A; color: #fff; }
.btn--red:hover { background: #E6334D; }
.btn--ghost { border-color: #fff; color: #fff; background: transparent; }
.btn--ghost:hover { background: rgba(255, 255, 255, 0.14); }

.orb { position: absolute; pointer-events: none; border-radius: 50%; }
.orb--ring {
  width: clamp(220px, 38vw, 460px); aspect-ratio: 1; right: -9%; top: -12%;
  border: 2px dashed rgba(255, 255, 255, 0.26); animation: spin 50s linear infinite;
}
.orb--ring::after { content: ""; position: absolute; width: 16px; height: 16px; border-radius: 50%; background: var(--red-on-blue); top: 12%; left: 12%; }
.orb--dot {
  width: clamp(48px, 8vw, 96px); aspect-ratio: 1; left: 2%; bottom: calc(var(--wave-h) + 2%);
  background: var(--band-red); opacity: 0.6; animation: float 7s ease-in-out infinite;
}

.hero__card {
  background: var(--band-red); color: #fff; border-radius: 6px;
  padding: clamp(20px, 3vw, 30px); min-width: 0;
  animation: rise 0.8s 0.1s var(--ease) both, bob 7s ease-in-out 1s infinite;
}
.badge {
  font-family: var(--font-display); font-stretch: 125%; font-weight: 900; line-height: 1;
  font-size: clamp(3rem, 9vw, 5.2rem); letter-spacing: -0.02em;
  padding-bottom: 18px; border-bottom: 1px solid var(--on-band-line);
}
.avatar { display: block; width: 100%; max-width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 4px; border: 3px solid rgba(255, 255, 255, 0.9); }
.photo-tools { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.pbtn {
  font: 600 13px/1 var(--font-body); color: #fff; background: transparent; border: 2px dashed #fff;
  border-radius: 4px; padding: 9px 14px; cursor: pointer; transition: background 0.2s, transform 0.2s var(--pop);
}
.pbtn:hover { background: rgba(255, 255, 255, 0.16); }
.pbtn:active { transform: scale(0.95); }
.pimg { display: block; width: 100%; max-width: 100%; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 4px; margin-bottom: 4px; }
.facts { margin: 18px 0 0; display: grid; gap: 12px; }
.facts div { display: grid; gap: 2px; }
.facts dt { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: rgba(255, 255, 255, 0.82); }
.facts dd { margin: 0; font-weight: 500; overflow-wrap: anywhere; }

@keyframes rise { from { transform: translateY(18px); } to { transform: none; } }
@keyframes letter { from { transform: translateY(0.45em) rotate(9deg); } to { transform: none; } }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-9px); } }
@keyframes float { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(14px, -18px); } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes drift { to { transform: translateX(-50%); } }
@keyframes ring { from { transform: scale(0.6); opacity: 0.9; } to { transform: scale(1.7); opacity: 0; } }
@keyframes cardIn { from { transform: perspective(900px) translateY(46px) rotateX(18deg); } }

/* GIỚI THIỆU: gạch nổi bật vẽ ra dưới cụm từ chính, các giá trị trồi lên */
.about { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.6fr); gap: clamp(28px, 5vw, 64px); }
.about h2 mark { background: none; color: inherit; position: relative; isolation: isolate; }
.about h2 mark::after {
  content: ""; position: absolute; left: 0; right: 0; bottom: 0.05em; height: 0.3em; z-index: -1;
  background: var(--red-text); opacity: 0.3; transform-origin: left; transition: transform 1s 0.25s var(--ease);
}
.about__body { display: grid; gap: 16px; color: var(--ink-soft); }
.about__body p { max-width: 62ch; }
.values { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 170px), 1fr)); gap: 20px; margin-top: 12px; }
.value { position: relative; border-top: 2px solid var(--line); padding-top: 14px; transition: transform 0.8s calc(var(--i, 0) * 130ms + 0.2s) var(--ease); }
.value::after {
  content: ""; position: absolute; left: 0; top: -2px; width: 100%; height: 2px; background: var(--blue-text);
  transform-origin: left; transition: transform 0.9s calc(var(--i, 0) * 130ms + 0.35s) var(--ease);
}
.value:nth-child(even)::after { background: var(--red-text); }
.value b { display: flex; align-items: center; gap: 8px; font-family: var(--font-display); font-stretch: 112%; font-weight: 800; font-size: 1.1rem; color: var(--ink); }
.value b::before { content: ""; width: 10px; height: 10px; background: var(--blue-text); transition: transform 0.4s var(--pop); }
.value:hover b::before { transform: rotate(90deg) scale(1.3); }
.value:nth-child(even) b::before { background: var(--red-text); }
.value p { margin-top: 6px; font-size: 15px; line-height: 1.55; }

/* KỸ NĂNG: đường kẻ vẽ ra, các dòng trượt vào, chấm mức độ bật lên lần lượt */
.skills { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 250px), 1fr)); gap: clamp(24px, 4vw, 44px); }
.sgroup h3 {
  font-family: var(--font-mono); font-stretch: 100%; font-size: 13px; font-weight: 500;
  letter-spacing: 0.12em; text-transform: uppercase; padding-bottom: 10px; position: relative;
}
.sgroup h3::after {
  content: ""; position: absolute; left: 0; bottom: 0; width: 100%; height: 2px; background: #fff;
  transform-origin: left; transition: transform 0.9s var(--ease);
}
.sgroup ul { list-style: none; margin: 0; padding: 0; }
.sgroup li {
  display: flex; align-items: center; justify-content: space-between; gap: 14px;
  padding: 12px 0; border-bottom: 1px solid var(--on-band-line);
  transition: transform 0.7s calc(var(--i, 0) * 100ms + 0.25s) var(--ease);
}
.sgroup li span:first-child { min-width: 0; font-weight: 500; }
.note { font-family: var(--font-mono); font-size: 13px; color: var(--on-band-soft); text-align: right; }
.dots { display: inline-flex; gap: 5px; flex: none; }
.dot { width: 11px; height: 11px; border-radius: 50%; border: 2px solid #fff; }
.dot.on { background: #fff; transition: transform 0.5s calc(var(--i, 0) * 100ms + var(--d, 0) * 80ms + 0.5s) var(--pop); }
.sgroup li:hover .dot.on { animation: wiggle 0.5s calc(var(--d, 0) * 40ms) ease; }
@keyframes wiggle { 50% { transform: translateY(-4px); } }

/* HỌC VẤN: trục thời gian vẽ từ trên xuống, mốc bật lên, mốc hiện tại có vòng sóng */
.two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: clamp(32px, 6vw, 72px); }
.col h3 { font-stretch: 112%; font-weight: 800; font-size: 1.35rem; margin-bottom: 24px; display: flex; align-items: center; gap: 10px; }
.col h3::before { content: ""; width: 12px; height: 12px; background: var(--blue-text); }
.col:nth-child(even) h3::before { background: var(--red-text); }
.tl { list-style: none; margin: 0; padding: 0; display: grid; gap: 30px; position: relative; }
.tl::before {
  content: ""; position: absolute; left: 7px; top: 8px; bottom: 8px; width: 2px; background: var(--line);
  transform-origin: top; transition: transform 1.5s cubic-bezier(.5, 0, .2, 1);
}
.tl li { position: relative; padding-left: 36px; min-width: 0; transition: transform 0.8s calc(var(--i, 0) * 200ms + 0.3s) var(--ease); }
.tl li::before {
  content: ""; position: absolute; left: 0; top: 4px; width: 16px; height: 16px; border-radius: 50%;
  background: var(--blue-text); border: 3px solid var(--paper);
  transition: transform 0.55s calc(var(--i, 0) * 200ms + 0.5s) var(--pop);
}
.tl li:nth-child(even)::before { background: var(--red-text); }
.tl li.live::after {
  content: ""; position: absolute; left: -4px; top: 0; width: 24px; height: 24px; border-radius: 50%;
  border: 2px solid var(--blue-text); animation: ring 2.4s ease-out infinite; pointer-events: none;
}
.tl li.live:nth-child(even)::after { border-color: var(--red-text); }
.period { font-family: var(--font-mono); font-size: 13px; color: var(--ink-soft); letter-spacing: 0.04em; }
.tl h4 { font-stretch: 100%; font-weight: 700; font-size: 1.1rem; margin-top: 4px; line-height: 1.3; }
.org { font-weight: 600; color: var(--blue-text); font-size: 15px; }
.tl li:nth-child(even) .org { color: var(--red-text); }
.tl p { margin-top: 6px; color: var(--ink-soft); font-size: 15px; line-height: 1.6; max-width: 56ch; }

/* DỰ ÁN: thẻ lật lên từ dưới, nghiêng 3D theo con trỏ, ánh sáng chạy theo chuột */
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 20px; }
.card {
  position: relative; overflow: hidden; background: var(--card); color: var(--ink); border-radius: 6px; padding: 26px;
  display: flex; flex-direction: column; gap: 12px; min-width: 0;
  border: 2px solid transparent;
  transform: perspective(900px) translateY(var(--ty, 0px)) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg));
  transition: transform 0.18s ease-out, border-color 0.2s;
}
.card:hover { --ty: -4px; border-color: var(--red-on-blue); }
.card::before {
  content: ""; position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity 0.25s;
  background: radial-gradient(280px circle at var(--mx, 50%) var(--my, 0%), color-mix(in srgb, var(--blue-text) 16%, transparent), transparent 70%);
}
.card:hover::before { opacity: 1; }
.kicker { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-soft); }
.card h3 { font-stretch: 112%; font-weight: 800; font-size: 1.3rem; line-height: 1.2; }
.card p { color: var(--ink-soft); font-size: 15px; line-height: 1.6; }
.tags { display: flex; flex-wrap: wrap; gap: 8px; margin-top: auto; padding-top: 6px; }
.tag { font-family: var(--font-mono); font-size: 12px; padding: 3px 9px; border-radius: 3px; border: 1px solid currentColor; color: var(--blue-text); transition: transform 0.25s var(--pop); }
.tag:nth-child(even) { color: var(--red-text); }
.card:hover .tag { transform: translateY(-3px); }
.card:hover .tag:nth-child(2) { transition-delay: 0.05s; }
.card:hover .tag:nth-child(3) { transition-delay: 0.1s; }
.card a.more { font-weight: 600; font-size: 14px; color: var(--blue-text); text-decoration: underline; text-underline-offset: 3px; }

/* LIÊN HỆ: các dòng trượt vào từ phải, đèn trạng thái nhấp nháy, nút sao chép đổi màu */
.contact { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); gap: clamp(28px, 5vw, 64px); align-items: start; }
.contact__lead { margin-top: 16px; color: var(--on-band-soft); max-width: 44ch; }
.status {
  display: inline-flex; align-items: center; gap: 12px; margin-top: 22px; padding: 8px 16px;
  font-family: var(--font-mono); font-size: 13px; border: 1px solid var(--on-band-line); border-radius: 999px;
}
.status i { position: relative; width: 10px; height: 10px; border-radius: 50%; background: #fff; flex: none; }
.status i::after { content: ""; position: absolute; inset: 0; border-radius: 50%; border: 2px solid #fff; animation: ring 1.8s ease-out infinite; }
.crow {
  display: flex; flex-wrap: wrap; align-items: center; gap: 4px 16px; padding: 18px 0; border-top: 1px solid var(--on-band-line);
  transition: transform 0.8s calc(var(--i, 0) * 120ms + 0.2s) var(--ease);
}
.crow:last-child { border-bottom: 1px solid var(--on-band-line); }
.clabel { flex-basis: 100%; font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--on-band-soft); }
.cval { flex: 1; min-width: 0; font-size: clamp(1rem, 2.6vw, 1.3rem); font-weight: 600; overflow-wrap: anywhere; user-select: all; text-decoration: none; transition: transform 0.25s var(--ease); }
.crow:hover .cval { transform: translateX(6px); }
a.cval:hover { text-decoration: underline; text-underline-offset: 4px; }
.copy {
  flex: none; font: 600 13px/1 var(--font-body); color: #fff; background: transparent;
  border: 2px solid #fff; border-radius: 4px; padding: 9px 14px; cursor: pointer; min-width: 128px;
  transition: background 0.2s, color 0.2s, transform 0.2s var(--pop);
}
.copy:hover { background: rgba(255, 255, 255, 0.16); }
.copy:active { transform: scale(0.94); }
.copy.done { background: #fff; color: #A8142B; }

/* Trạng thái chờ: chỉ dịch chuyển hoặc co lại, chữ luôn hiện rõ */
.pending .about h2 mark::after { transform: scaleX(0); }
.pending .value { transform: translateY(24px); }
.pending .value::after { transform: scaleX(0); }
.pending .sgroup h3::after { transform: scaleX(0); }
.pending .sgroup li { transform: translateX(-26px); }
.pending .dot.on { transform: scale(0); }
.pending .tl::before { transform: scaleY(0); }
.pending .tl li { transform: translateY(28px); }
.pending .tl li::before { transform: scale(0); }
.pending .card { transform: perspective(900px) translateY(46px) rotateX(18deg); }
.pending .crow { transform: translateX(40px); }
.in .card { animation: cardIn 0.9s calc(var(--i, 0) * 140ms) var(--ease) backwards; }
.fx-init, .fx-init * { transition: none !important; }

.foot { background: var(--band-blue-deep); color: var(--on-band-soft); font-family: var(--font-mono); font-size: 13px; }
.foot .wrap { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 24px; padding-top: 22px; padding-bottom: 26px; }

@media (max-width: 800px) {
  .hero__grid, .about, .two, .contact { grid-template-columns: minmax(0, 1fr); }
  .nav { gap: 18px; }
  .brand span { display: none; }
  .orb--ring { right: -30%; }
}
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  .wave, .orb, .hero__card, .ch, .status i::after, .tl li.live::after, .in .card { animation: none; }
  .card, .btn, .crow, .cval, .tag { transition: none; }
}

const REDUCE = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const WAVE = '<path fill="currentColor" d="M0 30 c180 -30 540 30 720 0 c180 -30 540 30 720 0 c180 -30 540 30 720 0 c180 -30 540 30 720 0 L2880 60 L0 60 Z"/>';
const wave = kind => '<svg class="wave wave--' + kind + '" viewBox="0 0 2880 60" preserveAspectRatio="none" aria-hidden="true">' + WAVE + "</svg>";

function dots(n) {
  let h = "";
  for (let i = 1; i <= 5; i++) h += '<span class="dot' + (i <= n ? " on" : "") + '" style="--d:' + i + '"></span>';
  return '<span class="dots" role="img" aria-label="Mức ' + n + ' trên 5">' + h + "</span>";
}

function render() {
  const c = CV;
  const parts = c.name.trim().split(/\s+/);
  const lastWord = parts.length > 1 ? parts[parts.length - 1] : "";
  const firstWords = parts.length > 1 ? parts.slice(0, -1).join(" ") : parts[0];
  let n = 0;
  const splitWord = w => '<span class="w">' + Array.from(w).map(ch => '<span class="ch" style="--i:' + (n++) + '">' + esc(ch) + "</span>").join("") + "</span>";
  const nameHtml = firstWords.split(" ").map(splitWord).join(" ") + (lastWord ? ' <span class="hl">' + splitWord(lastWord) + "</span>" : "");

  const heroHtml = '<section class="band band--blue hero" id="top">' +
    '<div class="orb orb--ring" aria-hidden="true"></div><div class="orb orb--dot" aria-hidden="true"></div>' +
    '<div class="wrap hero__grid"><div>' +
    '<p class="eyebrow">Hồ sơ cá nhân</p>' +
    '<h1 class="hero__name" aria-label="' + esc(c.name) + '"><span aria-hidden="true">' + nameHtml + "</span></h1>" +
    '<p class="hero__role">' + esc(c.role) + "</p>" + rotHtml +
    '<p class="hero__pitch">' + esc(c.pitch) + "</p>" +
    '<div class="cta"><a class="btn btn--red" href="#projects">Xem dự án</a><a class="btn btn--ghost" href="#contact">Liên hệ</a></div>' +
    "</div>" +
    '<aside class="hero__card" aria-label="Thông tin nhanh">' +
    '<div class="photo-wrap">' +
    (c.photo ? '<img class="avatar" id="avatarImg" alt="Ảnh của ' + esc(c.name) + '" src="' + esc(c.photo) + '">' : '<div class="badge" id="badgeBox" aria-hidden="true">' + esc(initials.toUpperCase()) + "</div>") +
    (c.editMode ? '<div class="photo-tools"><button type="button" class="pbtn" id="addPhoto">' + (c.photo ? "Đổi ảnh" : "+ Thêm ảnh") + '</button><button type="button" class="pbtn" id="copyPhoto" hidden>Sao chép mã ảnh</button><input type="file" id="photoInput" accept="image/*" hidden></div>' : "") +
    "</div>" +
    '<dl class="facts">' + c.facts.map(f => "<div><dt>" + esc(f[0]) + "</dt><dd>" + esc(f[1]) + "</dd></div>").join("") + "</dl>" +
    "</aside></div>" + wave("paper") + "</section>";

  const aboutTitle = esc(c.about.title).replace(/\*(.+?)\*/g, "<mark>$1</mark>");
  const aboutHtml = '<section class="band band--paper" id="about" data-fx><div class="wrap about">' +
    '<div><p class="eyebrow eyebrow--blue">Giới thiệu</p><h2 class="h2">' + aboutTitle + "</h2></div>" +
    '<div class="about__body">' + c.about.paragraphs.map(p => "<p>" + esc(p) + "</p>").join("") +
    '<div class="values">' + c.about.values.map((v, i) => '<div class="value" style="--i:' + i + '"><b>' + esc(v.t) + "</b><p>" + esc(v.d) + "</p></div>").join("") + "</div></div>" +
    "</div>" + wave("red") + "</section>";

  const skillsHtml = '<section class="band band--red" id="skills" data-fx><div class="wrap">' +
    '<div class="sec-head"><p class="eyebrow">Kỹ năng</p><h2 class="h2">Những gì mình đã luyện và đang luyện</h2></div>' +
    '<div class="skills">' + c.skills.map(g =>
      '<div class="sgroup"><h3>' + esc(g.group) + "</h3><ul>" +
      g.items.map((it, i) => '<li style="--i:' + i + '"><span>' + esc(it.n) + "</span>" + (it.lv ? dots(it.lv) : '<span class="note">' + esc(it.note) + "</span>") + "</li>").join("") +
      "</ul></div>").join("") + "</div></div>" + wave("paper") + "</section>";

  const tl = list => '<ol class="tl">' + list.map((e, i) =>
    '<li style="--i:' + i + '"' + (/nay|hiện tại/i.test(e.period) ? ' class="live"' : "") + '><span class="period">' + esc(e.period) + "</span><h4>" + esc(e.title) + '</h4><div class="org">' + esc(e.org) + "</div><p>" + esc(e.desc) + "</p></li>").join("") + "</ol>";

  const eduHtml = '<section class="band band--paper" id="education" data-fx><div class="wrap">' +
    '<div class="sec-head"><p class="eyebrow eyebrow--red">Học vấn</p><h2 class="h2">Quá trình học và hoạt động</h2></div>' +
    '<div class="two"><div class="col"><h3>Học vấn</h3>' + tl(c.education) + '</div><div class="col"><h3>Hoạt động &amp; kinh nghiệm</h3>' + tl(c.activities) + "</div></div>" +
    "</div>" + wave("blue") + "</section>";

  const projHtml = '<section class="band band--blue" id="projects" data-fx><div class="wrap">' +
    '<div class="sec-head"><p class="eyebrow">Dự án</p><h2 class="h2">Những thứ mình đã làm</h2></div>' +
    '<div class="cards">' + c.projects.map((p, i) =>
      '<article class="card" style="--i:' + i + '">' + (p.image ? '<img class="pimg" alt="Ảnh dự án ' + esc(p.title) + '" src="' + esc(p.image) + '">' : "") + '<span class="kicker">' + esc(p.kicker) + "</span><h3>" + esc(p.title) + "</h3><p>" + esc(p.desc) + "</p>" +
      '<div class="tags">' + p.tags.map(t => '<span class="tag">' + esc(t) + "</span>").join("") + "</div>" +
      (p.url ? '<a class="more" href="' + esc(p.url) + '" target="_blank" rel="noopener">Xem chi tiết</a>' : "") + "</article>").join("") +
    "</div></div>" + wave("red") + "</section>";

  const contactHtml = '<section class="band band--red" id="contact" data-fx><div class="wrap contact">' +
    '<div><p class="eyebrow">Liên hệ</p><h2 class="h2">Cùng làm điều gì đó nhé</h2><p class="contact__lead">' + esc(c.contact.lead) + "</p>" +
    (c.contact.status ? '<p class="status"><i></i><span>' + esc(c.contact.status) + "</span></p>" : "") + "</div>" +
    "<div>" + c.contact.rows.map((r, i) =>
      '<div class="crow" style="--i:' + i + '"><span class="clabel">' + esc(r.label) + "</span>" +
      (r.href ? '<a class="cval" href="' + esc(r.href) + '" target="_blank" rel="noopener">' + esc(r.value) + "</a>" : '<span class="cval">' + esc(r.value) + "</span>") +
      '<button type="button" class="copy" data-copy="' + esc(r.value) + '">Sao chép</button></div>').join("") + "</div>" +
    "</div>" + wave("deep") + "</section>";

  const footHtml = '<footer class="foot"><div class="wrap"><span>© 2026 ' + esc(c.name) + '</span><span>Cập nhật ' + esc(c.updated) + "</span></div></footer>";

  document.getElementById("app").innerHTML = topHtml + noticeHtml + heroHtml + aboutHtml + skillsHtml + eduHtml + projHtml + contactHtml + footHtml;
}

function flash(btn, msg) {
  const old = btn.dataset.label || btn.textContent;
  btn.dataset.label = old;
  btn.textContent = msg;
  btn.classList.add("done");
  clearTimeout(btn._t);
  btn._t = setTimeout(function () { btn.textContent = old; btn.classList.remove("done"); }, 1800);
}

function wire() {
  document.addEventListener("click", function (e) {
    const hide = e.target.closest("#hideNotice");
    if (hide) { const nt = document.getElementById("notice"); if (nt) nt.hidden = true; return; }
    const cp = e.target.closest("#copyPhoto");
    if (cp) {
      try {
        navigator.clipboard.writeText(cp.dataset.src || "").then(function () { flash(cp, "Đã sao chép ✓"); }, function () { flash(cp, "Trình duyệt chặn sao chép"); });
      } catch (err) { flash(cp, "Trình duyệt chặn sao chép"); }
      return;
    }
    const btn = e.target.closest(".copy");
    if (!btn) return;
    const text = btn.getAttribute("data-copy");
    const select = function () {
      const el = btn.closest(".crow").querySelector(".cval");
      const r = document.createRange(); r.selectNodeContents(el);
      const s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
      flash(btn, "Đã chọn, nhấn Ctrl+C");
    };
    try {
      navigator.clipboard.writeText(text).then(function () { flash(btn, "Đã sao chép ✓"); }, select);
    } catch (err) { select(); }
  });

  try {
    const links = {};
    document.querySelectorAll("[data-link]").forEach(function (a) { links[a.dataset.link] = a; });
    const io = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) {
        if (!en.isIntersecting) return;
        Object.keys(links).forEach(function (k) { links[k].removeAttribute("aria-current"); });
        const a = links[en.target.id];
        if (a) a.setAttribute("aria-current", "true");
      });
    }, { rootMargin: "-40% 0px -55% 0px" });
    Object.keys(links).forEach(function (k) { const s = document.getElementById(k); if (s) io.observe(s); });
  } catch (err) { /* thanh điều hướng vẫn dùng được khi không có scrollspy */ }

  // thanh tiến độ cuộn
  try {
    const bar = document.querySelector(".progress");
    let tick = false;
    const update = function () {
      const d = document.documentElement;
      const max = d.scrollHeight - window.innerHeight;
      bar.style.setProperty("--p", max > 0 ? Math.min(1, Math.max(0, window.scrollY / max)) : 0);
      tick = false;
    };
    window.addEventListener("scroll", function () { if (!tick) { tick = true; requestAnimationFrame(update); } }, { passive: true });
    update();
  } catch (err) { /* không bắt buộc */ }
}

// Mỗi phần ở dưới màn hình lúc mở trang sẽ vào trạng thái chờ, rồi chạy hiệu ứng riêng khi cuộn tới
function revealOnScroll() {
  if (REDUCE || !("IntersectionObserver" in window)) return;
  const app = document.getElementById("app");
  const secs = Array.prototype.slice.call(document.querySelectorAll("[data-fx]"));
  const vh = window.innerHeight;
  const below = secs.filter(function (s) { return s.getBoundingClientRect().top > vh * 0.85; });
  if (!below.length) return;
  app.classList.add("fx-init");
  below.forEach(function (s) { s.classList.add("pending"); });
  void app.offsetHeight;
  requestAnimationFrame(function () { app.classList.remove("fx-init"); });
  const io = new IntersectionObserver(function (entries) {
    entries.forEach(function (en) {
      if (!en.isIntersecting) return;
      en.target.classList.remove("pending");
      en.target.classList.add("in");
      io.unobserve(en.target);
    });
  }, { rootMargin: "0px 0px -12% 0px" });
  below.forEach(function (s) { io.observe(s); });
}

// Từ khoá ở hero đổi liên tục
function rotator() {
  const el = document.getElementById("rotInner");
  if (!el || REDUCE) return;
  const n = el.children.length;
  if (n < 3) return;
  let i = 0;
  setInterval(function () {
    i++;
    el.style.transition = "transform 0.6s cubic-bezier(.7,0,.2,1)";
    el.style.transform = "translateY(-" + (i * 1.7) + "em)";
    if (i === n - 1) {
      setTimeout(function () { el.style.transition = "none"; el.style.transform = "translateY(0)"; i = 0; }, 680);
    }
  }, 2400);
}

// Thẻ dự án nghiêng 3D theo chuột
function tilt() {
  if (REDUCE) return;
  document.querySelectorAll(".card").forEach(function (card) {
    card.addEventListener("pointermove", function (e) {
      if (e.pointerType !== "mouse") return;
      const r = card.getBoundingClientRect();
      const x = (e.clientX - r.left) / r.width;
      const y = (e.clientY - r.top) / r.height;
      card.style.setProperty("--ry", ((x - 0.5) * 10).toFixed(2) + "deg");
      card.style.setProperty("--rx", ((0.5 - y) * 8).toFixed(2) + "deg");
      card.style.setProperty("--mx", (x * 100).toFixed(1) + "%");
      card.style.setProperty("--my", (y * 100).toFixed(1) + "%");
    });
    card.addEventListener("pointerleave", function () {
      card.style.setProperty("--ry", "0deg");
      card.style.setProperty("--rx", "0deg");
    });
  });
}

// Thêm ảnh đại diện: chọn ảnh từ máy, cắt vuông và thu nhỏ, lưu trong trình duyệt này
function applyPhoto(src) {
  const wrap = document.querySelector(".photo-wrap");
  if (!wrap) return;
  let img = document.getElementById("avatarImg");
  if (!img) {
    img = document.createElement("img");
    img.id = "avatarImg";
    img.className = "avatar";
    img.alt = "Ảnh của " + CV.name;
    wrap.insertBefore(img, wrap.firstChild);
  }
  img.src = src;
  const badge = document.getElementById("badgeBox");
  if (badge) badge.remove();
  const add = document.getElementById("addPhoto");
  if (add) add.textContent = "Đổi ảnh";
  const cpy = document.getElementById("copyPhoto");
  if (cpy) { cpy.hidden = false; cpy.dataset.src = src; }
}

function photoTools() {
  const input = document.getElementById("photoInput");
  const add = document.getElementById("addPhoto");
  if (!input || !add) return;
  try {
    const saved = localStorage.getItem("cv-photo");
    if (saved && !CV.photo) applyPhoto(saved);
  } catch (err) { /* không có bộ nhớ trình duyệt */ }
  add.addEventListener("click", function () { input.click(); });
  input.addEventListener("change", function () {
    const f = input.files && input.files[0];
    if (!f) return;
    const url = URL.createObjectURL(f);
    const im = new Image();
    im.onload = function () {
      const side = Math.min(im.width, im.height);
      const out = Math.min(640, side);
      const cv = document.createElement("canvas");
      cv.width = out; cv.height = out;
      const sx = (im.width - side) / 2;
      const sy = (im.height - side) * 0.2; // lệch lên trên để không cắt mất đầu
      cv.getContext("2d").drawImage(im, sx, sy, side, side, 0, 0, out, out);
      const data = cv.toDataURL("image/jpeg", 0.85);
      URL.revokeObjectURL(url);
      applyPhoto(data);
      try { localStorage.setItem("cv-photo", data); } catch (err) { /* ảnh vẫn hiện, chỉ không nhớ lần sau */ }
    };
    im.onerror = function () { URL.revokeObjectURL(url); flash(add, "Không đọc được ảnh"); };
    im.src = url;
    input.value = "";
  });
}

render();
wire();
photoTools();
revealOnScroll();
rotator();
tilt();
</script>
